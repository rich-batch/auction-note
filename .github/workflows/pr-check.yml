# PR이 열리거나 커밋이 추가될 때마다 돈다.
# 1) PR 본문에 "머지 전 확인할 것" 체크박스 목록을 채운다(이미 체크한 칸은 유지).
# 2) 바뀐 글을 "공개된 상태"로 보고 검사한다 — 머지하면 바로 공개되므로([publish.yml] 머지된 글 공개),
#    [확인 필요]·[경험 추가 필요] 같은 표시가 남아 있거나 공개되지 않은 글을 링크하면 빨간불.
# 3) 도구 코드가 바뀌었으면 계산 엔진 테스트를 돌린다.
# 4) 바뀐 글을 공개 상태로 바꾼 채 사이트를 빌드해 본다(배포는 하지 않음).
name: PR 검사

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Hugo 설치
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: PR 본문에 확인 목록 넣기
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body --jq .body > old-body.md
          node tools/pr-checklist.mjs "origin/${{ github.base_ref }}" --merge-into old-body.md > new-body.md
          gh pr edit "$PR" --body-file new-body.md

      - name: 바뀐 글 목록
        id: files
        run: |
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^content/(guide|analysis)/[^/]+/index\.md$' > articles.txt || true
          echo "공개될 글:"; cat articles.txt
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^tools/' && echo "tools=1" >> "$GITHUB_OUTPUT" || true

      - name: 글 검사 (공개 기준)
        run: |
          export PUBLISHING_FILES="$(cat articles.txt)"
          status=0
          while read -r f; do
            [ -z "$f" ] && continue
            type=$(echo "$f" | cut -d/ -f2)
            node "tools/check/$type.mjs" "$f" --as-published || status=1
          done < articles.txt
          exit $status

      - name: 계산 엔진 테스트
        if: steps.files.outputs.tools == '1'
        run: node --test tools/analysis/

      - name: 공개 상태로 빌드해 보기
        if: always()
        run: |
          while read -r f; do
            [ -z "$f" ] && continue
            sed -i 's/^draft: *true *$/draft: false/' "$f"
          done < articles.txt
          hugo --minify -d /tmp/site-preview
