baseURL = 'https://rich-batch.github.io/auction-note/'
locale = 'ko-kr'
title = '오늘의 경매 노트'
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
pagerSize = 6

[params]
description = '경매, 공매 투자 정보 블로그'
author = 'rich-batch'
# 처음 방문 시 밝은 화면(OS 다크 설정을 따라가지 않음). 오른쪽 위 토글로 다크 전환은 그대로 가능
defaultTheme = 'light'
# 홈은 layouts/home.html(경매 일정 | 경매 가이드 탭)이 그린다. mainSections는 RSS 등 테마 기능용
mainSections = ['guide', 'analysis']

[related]
  threshold = 20
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 50
