{{- define "main" }}
{{- with site.GetPage "/analysis" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p class="cal-desc">{{ . }}</p>{{ end }}
</header>
{{- end }}
{{ partial "calendar.html" (dict "month" .Params.month) }}
<p class="cal-back"><a href="{{ (site.GetPage "/analysis").RelPermalink }}">← 이번 달과 전체 분석 글</a></p>
{{- end }}
